name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Example round trip
        shell: bash
        run: |
          hil-attest create \
            --artifact examples/firmware.bin \
            --junit examples/results.xml \
            --dut examples/dut.json \
            --evidence examples/uart.log \
            --output build/example-attestation.json
          hil-attest verify build/example-attestation.json \
            --artifact examples/firmware.bin \
            --junit examples/results.xml \
            --dut examples/dut.json \
            --evidence examples/uart.log

